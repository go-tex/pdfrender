name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# This adapter pulls a heavy pure-Go PDF renderer (pdfcpu + friends) meant for
# CLI/server use, so CI builds and tests on the three desktop/server OSes rather
# than the fleet's qemu-exotic-arch + wasm matrix.
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go version
      - name: gofmt
        if: runner.os == 'Linux'
        shell: bash
        run: |
          u=$(gofmt -l .); if [ -n "$u" ]; then echo "::error::not gofmt-clean:"; echo "$u"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
